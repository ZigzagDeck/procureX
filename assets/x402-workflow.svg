<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Conditional x402 price-intelligence workflow</title><desc id="desc">ProcureX normalizes supplier prices, checks confidence and finalist status, then optionally pays for price intelligence and reranks the supplier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#111b36"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".55"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1440" height="620" rx="32" fill="url(#bg)"/><text x="72" y="80" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">Conditional x402 price-intelligence workflow</text><text x="72" y="116" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19">Payment happens only when uncertain pricing can materially improve a finalist decision.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="72" y="204" width="205" height="150" rx="20" fill="#172554" stroke="#38bdf8" stroke-opacity=".65"/><text x="96" y="258" fill="#e0f2fe" font-size="22" font-weight="800">1. Normalize</text><text x="96" y="292" fill="#cbd5e1" font-size="17">Supplier prices</text><text x="96" y="319" fill="#cbd5e1" font-size="17">and price bases</text>
    <rect x="345" y="204" width="225" height="150" rx="20" fill="#172554" stroke="#38bdf8" stroke-opacity=".65"/><text x="369" y="250" fill="#e0f2fe" font-size="22" font-weight="800">2. Confidence gate</text><text x="369" y="285" fill="#cbd5e1" font-size="16">PER_BOX / CARTON / TOTAL</text><text x="369" y="312" fill="#fbbf24" font-size="17" font-weight="700">low confidence</text>
    <rect x="642" y="204" width="225" height="150" rx="20" fill="#172554" stroke="#38bdf8" stroke-opacity=".65"/><text x="666" y="250" fill="#e0f2fe" font-size="22" font-weight="800">3. Value gate</text><text x="666" y="285" fill="#cbd5e1" font-size="16">Finalist score + budget</text><text x="666" y="312" fill="#cbd5e1" font-size="16">+ trusted references?</text>
    <rect x="939" y="182" width="216" height="194" rx="20" fill="url(#blue)"/><text x="963" y="239" fill="#fff" font-size="23" font-weight="800">4. x402 call</text><text x="963" y="276" fill="#e0f2fe" font-size="16">402 challenge →</text><text x="963" y="303" fill="#e0f2fe" font-size="16">signed payment →</text><text x="963" y="330" fill="#e0f2fe" font-size="16">completed transaction</text>
    <rect x="1227" y="204" width="141" height="150" rx="20" fill="url(#green)"/><text x="1251" y="256" fill="#fff" font-size="22" font-weight="800">5. Correct</text><text x="1251" y="290" fill="#ecfeff" font-size="16">Median price</text><text x="1251" y="317" fill="#ecfeff" font-size="16">re-score</text>
  </g>
  <path d="M277 279h58M570 279h62M867 279h62M1155 279h62" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><path d="M754 354v104h-230" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <rect x="270" y="425" width="485" height="107" rx="18" fill="#1e293b" stroke="#475569"/><text x="296" y="465" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750">Skip and log a decision</text><text x="296" y="497" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="16">No payment if confidence is high, score is not finalist-level,</text><text x="296" y="521" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="16">budget is insufficient, or no trusted references are available.</text><text x="944" y="468" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Transaction + correction note are visible in the UI</text>
</svg>
